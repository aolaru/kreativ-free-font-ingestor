name: Deploy To WordPress

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target_path:
        description: 'Remote plugin directory path'
        required: false
        default: ''

concurrency:
  group: wordpress-deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      - name: Lint plugin PHP files
        run: |
          find . \
            -path './.git' -prune -o \
            -path './.github' -prune -o \
            -name '*.php' -print | while read -r file; do
              php -l "$file"
            done

      - name: Build deploy directory
        run: |
          mkdir -p build/kreativ-font-ingestor
          rsync -av \
            --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'build/' \
            --exclude '*.zip' \
            ./ build/kreativ-font-ingestor/

      - name: Archive deploy package
        run: |
          cd build
          zip -r kreativ-font-ingestor-deploy.zip kreativ-font-ingestor

      - name: Upload deploy artifact
        uses: actions/upload-artifact@v4
        with:
          name: kreativ-font-ingestor-deploy
          path: build/kreativ-font-ingestor-deploy.zip

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.WP_SFTP_PORT }}" "${{ secrets.WP_SFTP_HOST }}" >> ~/.ssh/known_hosts

      - name: Resolve remote target path
        id: target
        env:
          INPUT_TARGET_PATH: ${{ github.event.inputs.target_path }}
          SECRET_TARGET_PATH: ${{ secrets.WP_PLUGIN_TARGET_PATH }}
        run: |
          TARGET_PATH="${INPUT_TARGET_PATH:-$SECRET_TARGET_PATH}"

          if [ -z "$TARGET_PATH" ]; then
            echo "Remote target path is missing."
            exit 1
          fi

          echo "target_path=$TARGET_PATH" >> "$GITHUB_OUTPUT"

      - name: Deploy plugin files
        env:
          WP_HOST: ${{ secrets.WP_SFTP_HOST }}
          WP_PORT: ${{ secrets.WP_SFTP_PORT }}
          WP_USER: ${{ secrets.WP_SFTP_USER }}
          WP_PASSWORD: ${{ secrets.WP_SFTP_PASSWORD }}
          TARGET_PATH: ${{ steps.target.outputs.target_path }}
        run: |
          if [ -z "$WP_HOST" ] || [ -z "$WP_PORT" ] || [ -z "$WP_USER" ] || [ -z "$WP_PASSWORD" ]; then
            echo "One or more required SFTP secrets are missing."
            exit 1
          fi

          lftp -u "$WP_USER","$WP_PASSWORD" "sftp://$WP_HOST:$WP_PORT" <<EOF
          set sftp:auto-confirm yes
          mkdir -p "$TARGET_PATH"
          mirror -R --delete --verbose build/kreativ-font-ingestor "$TARGET_PATH"
          bye
          EOF
