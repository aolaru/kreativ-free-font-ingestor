name: Deploy To WordPress

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target_path:
        description: 'Remote plugin directory path'
        required: false
        default: ''

concurrency:
  group: wordpress-deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      - name: Lint plugin PHP files
        run: |
          find . \
            -path './.git' -prune -o \
            -path './.github' -prune -o \
            -name '*.php' -print | while read -r file; do
              php -l "$file"
            done

      - name: Build deploy directory
        run: |
          mkdir -p build/kreativ-font-ingestor
          rsync -av \
            --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'build/' \
            --exclude '*.zip' \
            ./ build/kreativ-font-ingestor/

      - name: Archive deploy package
        run: |
          cd build
          zip -r kreativ-font-ingestor-deploy.zip kreativ-font-ingestor

      - name: Upload deploy artifact
        uses: actions/upload-artifact@v4
        with:
          name: kreativ-font-ingestor-deploy
          path: build/kreativ-font-ingestor-deploy.zip

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Resolve SFTP connection settings
        id: sftp
        env:
          SFTP_HOST: ${{ secrets.WP_SSH_HOST }}
          SFTP_PORT: ${{ secrets.WP_SSH_PORT }}
          SFTP_USER: ${{ secrets.WP_SSH_USER }}
          SFTP_PASSWORD: ${{ secrets.WP_SSH_PASSWORD }}
        run: |
          PORT="${SFTP_PORT:-22}"

          if [ -z "$SFTP_HOST" ]; then
            echo "Missing required secret: WP_SSH_HOST"
            exit 1
          fi

          if [ -z "$SFTP_USER" ]; then
            echo "Missing required secret: WP_SSH_USER"
            exit 1
          fi

          if [ -z "$SFTP_PASSWORD" ]; then
            echo "Missing required secret: WP_SSH_PASSWORD"
            exit 1
          fi

          echo "host=$SFTP_HOST" >> "$GITHUB_OUTPUT"
          echo "port=$PORT" >> "$GITHUB_OUTPUT"
          echo "user=$SFTP_USER" >> "$GITHUB_OUTPUT"
          echo "password=$SFTP_PASSWORD" >> "$GITHUB_OUTPUT"

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ steps.sftp.outputs.port }}" "${{ steps.sftp.outputs.host }}" >> ~/.ssh/known_hosts

      - name: Resolve remote target path
        id: target
        env:
          INPUT_TARGET_PATH: ${{ github.event.inputs.target_path }}
          SECRET_TARGET_PATH: ${{ secrets.WP_REMOTE_PATH }}
        run: |
          TARGET_PATH="${INPUT_TARGET_PATH:-$SECRET_TARGET_PATH}"

          if [ -z "$TARGET_PATH" ]; then
            echo "Remote target path is missing."
            exit 1
          fi

          echo "target_path=$TARGET_PATH" >> "$GITHUB_OUTPUT"

      - name: Deploy plugin files
        env:
          WP_HOST: ${{ steps.sftp.outputs.host }}
          WP_PORT: ${{ steps.sftp.outputs.port }}
          WP_USER: ${{ steps.sftp.outputs.user }}
          WP_PASSWORD: ${{ steps.sftp.outputs.password }}
          TARGET_PATH: ${{ steps.target.outputs.target_path }}
        run: |
          lftp -u "$WP_USER","$WP_PASSWORD" "sftp://$WP_HOST:$WP_PORT" <<EOF
          set sftp:auto-confirm yes
          mkdir -p "$TARGET_PATH"
          mirror -R --delete --verbose build/kreativ-font-ingestor "$TARGET_PATH"
          bye
          EOF
